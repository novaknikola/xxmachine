<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<title>XXmachine Clipper — podešavanja</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #0b0f14; color: #e5e7eb; margin: 0; padding: 28px; width: 380px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.hint { color: #9ca3af; font-size: 12px; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: #9ca3af; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; background: #161b22; border: 1px solid #30363d; color: #e5e7eb; border-radius: 8px; padding: 9px 10px; font: 13px/1.4 ui-monospace, monospace; }
  input:focus { outline: none; border-color: #16a34a; }
  button { margin-top: 18px; width: 100%; background: #16a34a; color: #fff; border: none; border-radius: 8px; padding: 10px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { margin-top: 8px; background: #21262d; }
  #status { margin-top: 14px; font-size: 12px; min-height: 16px; }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; }
</style>
</head>
<body>
  <h1>XXmachine Clipper</h1>
  <p class="hint">Otvori XXmachine → Settings → Content Engine i kopiraj Site URL + Access token odatle.</p>

  <label for="apiBase">Site URL</label>
  <input id="apiBase" placeholder="https://tvoj-domen.com" />

  <label for="token">Access token</label>
  <input id="token" type="password" placeholder="xmpat_…" />

  <button id="save">Sačuvaj</button>
  <button id="test" class="secondary">Testiraj konekciju</button>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
